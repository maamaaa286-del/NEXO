<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101923"><title>OPEN CITY — Mobile Build</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9db8c3;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff}.top{position:absolute;top:env(safe-area-inset-top,12px);left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:950;letter-spacing:2px;text-shadow:0 2px 10px #000}.brand small{display:block;font-size:9px;letter-spacing:3px;color:#a9d8ff;font-weight:700}.pill,.glass{background:#101923c9;border:1px solid #ffffff2c;border-radius:14px;padding:9px 12px;font-size:11px;backdrop-filter:blur(12px);box-shadow:0 6px 20px #0002}.rightHud{position:absolute;right:14px;top:72px;display:grid;gap:8px;text-align:center}.stat strong{display:block;font-size:17px}.stat span{font-size:9px;color:#a9bdc9}.leftHud{position:absolute;left:14px;top:72px;width:90px;height:90px;border-radius:18px;background:#101923b8;border:1px solid #ffffff35;overflow:hidden;backdrop-filter:blur(8px)}#map{width:100%;height:100%}#hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap;background:#101923c9;border:1px solid #ffffff35;border-radius:12px;padding:9px 13px;font-size:11px;transition:opacity .5s}.bottomLabel{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:9px;color:#e5edf2;background:#1019239c;padding:6px 10px;border-radius:20px;white-space:nowrap}
#pad{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom,0px));left:16px;width:148px;height:148px;pointer-events:auto}.key{position:absolute;width:46px;height:46px;border-radius:15px;border:1px solid #ffffff60;background:#111c;color:white;font-size:19px;box-shadow:0 5px 15px #0003;touch-action:none}.key:active,.act:active{background:#3874a9}#up{top:0;left:51px}#down{bottom:0;left:51px}#left{top:51px;left:0}#right{top:51px;right:0}
#actions{position:fixed;bottom:calc(34px + env(safe-area-inset-bottom,0px));right:18px;display:flex;align-items:end;gap:9px;pointer-events:auto}.act{width:66px;height:66px;border-radius:50%;border:1px solid #ffffff70;background:#142432e8;color:white;font-weight:800;font-size:11px;box-shadow:0 6px 18px #0004;touch-action:none}#enter{background:#1769a8e8}#brake{width:54px;height:54px;background:#263b4cdd}
</style></head><body>
<div id="hud"><div class="top"><div class="brand">OPEN CITY <small>LOS-STYLE MOBILE SANDBOX</small></div><div class="pill" id="mode">استكشاف المدينة</div></div>
<div class="leftHud"><canvas id="map" width="180" height="180"></canvas></div>
<div class="rightHud"><div class="glass stat"><strong id="speed">0</strong><span>كم/س</span></div><div class="glass stat"><strong id="area">وسط المدينة</strong><span>الموقع</span></div></div>
<div id="hint">اسحب يمين الشاشة لتحريك الكاميرا • استخدم الأسهم للحركة</div><div class="bottomLabel">نسخة تجريبية — عالم ثلاثي الأبعاد قيد البناء</div></div>
<div id="pad"><button class="key" id="up" aria-label="تقدم">▲</button><button class="key" id="down" aria-label="رجوع">▼</button><button class="key" id="left" aria-label="يسار">◀</button><button class="key" id="right" aria-label="يمين">▶</button></div>
<div id="actions"><button class="act" id="brake">فرامل</button><button class="act" id="enter">دخول<br>السيارة</button></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{const hint=document.getElementById('hint');if(!window.THREE){hint.textContent='تعذّر تحميل محرك 3D — تحقق من اتصال الإنترنت';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9dbbc8);scene.fog=new THREE.Fog(0x9dbbc8,65,185);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,320);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdff1ff,0x58614c,2.1));const sun=new THREE.DirectionalLight(0xffe4bd,2.5);sun.position.set(-38,62,32);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-75;sun.shadow.camera.right=75;sun.shadow.camera.top=75;sun.shadow.camera.bottom=-75;scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.82});const groundMat=mat(0x748b75),roadMat=mat(0x303943),walkMat=mat(0xbab8ad),lineMat=mat(0xe8dfc5),windowMat=new THREE.MeshStandardMaterial({color:0x8fb5c7,roughness:.3,metalness:.15}),darkGlass=mat(0x263b4a);
function cube(w,h,d,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260),groundMat);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// Roads and a connected street grid
cube(18,.1,220,roadMat,0,.04,0);cube(220,.1,16,roadMat,0,.04,0);
for(let x=-90;x<=90;x+=30){if(x===0)continue;cube(8,.08,220,roadMat,x,.035,0)}
for(let z=-90;z<=90;z+=30){if(z===0)continue;cube(220,.08,8,roadMat,0,.035,z)}
for(let z=-105;z<110;z+=8)cube(.16,.015,3.4,lineMat,0,.105,z);
for(let x=-105;x<110;x+=8)cube(3.4,.015,.16,lineMat,x,.105,0);
for(const s of [-1,1]){cube(2,.18,220,walkMat,s*10,.12,0);cube(220,.18,2,walkMat,0,.12,s*9)}
// Blocks, varied heights, roofs, storefronts and windows
const walls=[0xc8b99f,0x9eafb5,0xd5cbbb,0x788b91,0xb99f89,0xa9b7ad].map(mat),roof=mat(0x51585b),shop=mat(0x43515a);
for(let gx=-3;gx<=3;gx++)for(let gz=-3;gz<=3;gz++){if(gx===0&&gz===0)continue;const bx=gx*30,bz=gz*30;for(let j=0;j<3;j++){if(Math.random()<.18)continue;const x=bx+(j-1)*8,z=bz+(Math.random()-.5)*10,w=6+Math.random()*3,d=7+Math.random()*4,h=9+Math.random()*24,m=walls[Math.floor(Math.random()*walls.length)];cube(w,h,d,m,x,h/2,z);cube(w+.25,.3,d+.25,roof,x,h+.12,z);cube(w*.7,.22,d*.7,shop,x,h+.3,z);for(let y=2.2;y<h-1;y+=2.7)for(let xx=-w/2+1;xx<w/2-.4;xx+=1.8){cube(.95,1.15,.07,windowMat,x+xx,y,z+d/2+.045);cube(.95,1.15,.07,windowMat,x+xx,y,z-d/2-.045)}}}
// Park with trees and benches
const trunk=mat(0x725039),leaf=mat(0x3f704e),bench=mat(0x73563c);
cube(21,.13,21,mat(0x91a17d),-24,.14,24);for(let i=0;i<12;i++){const x=-32+Math.random()*16,z=16+Math.random()*16;const t=new THREE.Mesh(new THREE.CylinderGeometry(.18,.26,2.3,8),trunk);t.position.set(x,1.3,z);scene.add(t);const c=new THREE.Mesh(new THREE.SphereGeometry(1.35,10,8),leaf);c.position.set(x,3,z);c.scale.y=1.15;c.castShadow=true;scene.add(c)}cube(3,.3,.45,bench,-24,.55,24);
// Street lamps
const metal=mat(0x343b40),lampMat=new THREE.MeshStandardMaterial({color:0xffe5ae,emissive:0x80602a});for(let z=-80;z<=80;z+=24)for(const s of [-1,1]){const pole=new THREE.Mesh(new THREE.CylinderGeometry(.07,.1,5,7),metal);pole.position.set(s*12,2.5,z);scene.add(pole);cube(.9,.08,.08,metal,s*12.35,4.9,z);const bulb=new THREE.Mesh(new THREE.SphereGeometry(.17,8,8),lampMat);bulb.position.set(s*12.75,4.8,z);scene.add(bulb)}
// Player
const player=new THREE.Group();scene.add(player);const shirt=mat(0x28517a),skin=mat(0xc99470),pants=mat(0x202b38);const legs=cube(.62,.72,.34,pants,0,.43,0,player);const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.39,.72,4,8),shirt);torso.position.y=1.15;player.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.27,14,12),skin);head.position.y=1.9;player.add(head);player.position.set(-2,0,6);
// Detailed compact car
const car=new THREE.Group();scene.add(car);const red=mat(0x9e3038),rubber=mat(0x15191d),rim=mat(0x9da8ae);cube(2.15,.62,4.25,red,0,.78,0,car);cube(1.72,.78,2.15,darkGlass,0,1.42,-.28,car);cube(1.9,.13,1.1,red,0,1.83,.15,car);for(const x of [-1,1])for(const z of [-1.38,1.38]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.24,18),rubber);w.rotation.z=Math.PI/2;w.position.set(x,.43,z);car.add(w);const r=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.25,12),rim);r.rotation.z=Math.PI/2;r.position.set(x*1.01,.43,z);car.add(r)}for(const x of [-.7,.7])cube(.35,.16,.06,mat(0xffe9bf),x,.82,2.15,car);car.position.set(2,0,1);
// Touch controls
const keys={};function bind(id,k){const el=document.getElementById(id);const down=e=>{e.preventDefault();keys[k]=true;try{el.setPointerCapture(e.pointerId)}catch(_){}};const up=()=>keys[k]=false;el.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,up))}
bind('up','f');bind('down','b');bind('left','l');bind('right','r');bind('brake','brake');
let driving=false,yaw=0,carSpeed=0,drag=null,camPitch=0.12;const enter=document.getElementById('enter'),mode=document.getElementById('mode');
function enterCar(){if(!driving&&player.position.distanceTo(car.position)<7){driving=true;player.visible=false;mode.textContent='قيادة السيارة';enter.innerHTML='خروج';hint.textContent='قد السيارة بالأسهم واسحب الشاشة لتغيير اتجاه النظر'}setTimeout(()=>hint.style.opacity='0',3200)}enter.addEventListener('click',()=>{if(driving){driving=false;player.visible=true;player.position.copy(car.position).add(new THREE.Vector3(2,0,0));yaw=car.rotation.y;mode.textContent='استكشاف المدينة';enter.innerHTML='دخول<br>السيارة'}else enterCar()});
renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.38&&e.clientY<innerHeight-165)drag={x:e.clientX,y:e.clientY,id:e.pointerId}});renderer.domElement.addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId){yaw-=(e.clientX-drag.x)*.006;camPitch=THREE.MathUtils.clamp(camPitch+(e.clientY-drag.y)*.002,-.05,.55);drag.x=e.clientX;drag.y=e.clientY}});['pointerup','pointercancel'].forEach(ev=>renderer.domElement.addEventListener(ev,()=>drag=null));
const clock=new THREE.Clock(),move=new THREE.Vector3(),map=document.getElementById('map').getContext('2d');function drawMap(target){map.clearRect(0,0,180,180);map.fillStyle='#182733';map.fillRect(0,0,180,180);map.strokeStyle='#687b83';map.lineWidth=7;for(let i=0;i<180;i+=45){map.beginPath();map.moveTo(i,0);map.lineTo(i,180);map.stroke();map.beginPath();map.moveTo(0,i);map.lineTo(180,i);map.stroke()}map.fillStyle='#5b8a64';map.fillRect(14,116,35,35);map.fillStyle='#fff';map.beginPath();map.arc(90+target.x*.55,90+target.z*.55,5,0,Math.PI*2);map.fill();map.strokeStyle='#fff';map.lineWidth=1.5;map.beginPath();map.moveTo(90+target.x*.55,90+target.z*.55);map.lineTo(90+target.x*.55-Math.sin(yaw)*12,90+target.z*.55-Math.cos(yaw)*12);map.stroke()}
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04),f=(keys.f?1:0)-(keys.b?1:0),turn=(keys.r?1:0)-(keys.l?1:0);if(driving){const braking=keys.brake?Math.pow(.7,dt*12):1;carSpeed=THREE.MathUtils.clamp((carSpeed+f*13*dt)*Math.pow(.94,dt*30)*braking,-6,22);car.rotation.y-=turn*dt*(.8+Math.abs(carSpeed)*.045);car.position.x+=Math.sin(car.rotation.y)*carSpeed*dt;car.position.z+=Math.cos(car.rotation.y)*carSpeed*dt;car.position.x=THREE.MathUtils.clamp(car.position.x,-100,100);car.position.z=THREE.MathUtils.clamp(car.position.z,-100,100)}else{if(f||turn){yaw+=turn*dt*2.1;player.rotation.y=yaw;move.set(0,0,-f*dt*5).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);player.position.add(move);player.position.x=THREE.MathUtils.clamp(player.position.x,-104,104);player.position.z=THREE.MathUtils.clamp(player.position.z,-104,104)}}
const target=driving?car.position:player.position,rot=driving?car.rotation.y:yaw;const dist=driving?10:8.5,desired=new THREE.Vector3(Math.sin(rot)*dist,4.2+camPitch*5,Math.cos(rot)*dist).add(target);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(target.x,target.y+1.1,target.z);document.getElementById('speed').textContent=String(Math.round(Math.abs(carSpeed)*3.6));document.getElementById('area').textContent=Math.abs(target.x)<18&&Math.abs(target.z)<18?'وسط المدينة':target.x<-14&&target.z>12?'الحديقة':'المدينة';drawMap(target);renderer.render(scene,camera)}
loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})})();
</script></body></html>
