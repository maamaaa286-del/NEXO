<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111820"><title>OPEN CITY | District One</title>
<style>
:root{--glass:#101b25d9;--line:#ffffff28;--cyan:#8ed9e7}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a8c5cb;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;color:#fff}.top{position:absolute;top:calc(12px + env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:17px;font-weight:950;letter-spacing:2px;text-shadow:0 2px 12px #000}.brand small{display:block;font-size:8px;letter-spacing:3px;color:var(--cyan)}.glass{background:var(--glass);border:1px solid var(--line);border-radius:15px;padding:9px 12px;backdrop-filter:blur(16px);box-shadow:0 8px 25px #0003}.pill{font-size:10px;color:#dceaf0}.leftHud{position:absolute;left:14px;top:76px;width:94px;height:94px;border-radius:17px;overflow:hidden;padding:0}.leftHud canvas{width:100%;height:100%}.rightHud{position:absolute;right:14px;top:76px;display:grid;gap:7px;text-align:center}.stat{min-width:76px}.stat strong{display:block;font-size:18px;line-height:1.1}.stat span{font-size:9px;color:#a9c0cc}.mission{position:absolute;top:185px;left:14px;width:140px;font-size:9px;color:#dce8ed;line-height:1.6}.mission b{color:var(--cyan);font-size:10px}.bottomLabel{position:absolute;bottom:calc(9px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:9px;color:#e7eff2;background:#101923a8;padding:6px 11px;border-radius:20px;white-space:nowrap}#hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap;background:#101923db;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:11px;transition:opacity .8s;box-shadow:0 8px 30px #0004}
#pad{position:fixed;bottom:calc(25px + env(safe-area-inset-bottom));left:15px;width:150px;height:150px;pointer-events:auto}.key{position:absolute;width:47px;height:47px;border-radius:15px;border:1px solid #ffffff55;background:#142431e8;color:white;font-size:19px;box-shadow:0 6px 18px #0004;touch-action:none}.key:active,.act:active{background:#267da0}#up{top:0;left:51px}#down{bottom:0;left:51px}#left{top:51px;left:0}#right{top:51px;right:0}#actions{position:fixed;bottom:calc(34px + env(safe-area-inset-bottom));right:16px;display:flex;align-items:end;gap:9px;pointer-events:auto}.act{width:66px;height:66px;border-radius:50%;border:1px solid #ffffff70;background:#142a39ed;color:white;font-weight:850;font-size:11px;box-shadow:0 7px 20px #0005;touch-action:none}#enter{background:#147b9c}#brake{width:54px;height:54px;background:#283d4c}
</style></head><body>
<div id="hud"><div class="top"><div class="brand">OPEN CITY <small>DISTRICT ONE • MOBILE</small></div><div class="glass pill" id="mode">استكشاف الحي</div></div>
<div class="glass leftHud"><canvas id="map" width="188" height="188"></canvas></div>
<div class="rightHud"><div class="glass stat"><strong id="speed">0</strong><span>كم/س</span></div><div class="glass stat"><strong id="area">وسط الحي</strong><span>موقعك</span></div></div>
<div class="glass mission"><b>الحي الأول</b><br>استكشف الشوارع والحديقة. اقترب من السيارة واضغط دخول للقيادة.</div>
<div id="hint">حرّك الشخصية بالأسهم • اسحب الشاشة لتدوير الكاميرا</div><div class="bottomLabel">نسخة تطوير أولية • District One</div></div>
<div id="pad"><button class="key" id="up">▲</button><button class="key" id="down">▼</button><button class="key" id="left">◀</button><button class="key" id="right">▶</button></div>
<div id="actions"><button class="act" id="brake">فرامل</button><button class="act" id="enter">دخول<br>السيارة</button></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{const $=id=>document.getElementById(id),hint=$('hint');if(!window.THREE){hint.textContent='تعذّر تحميل المحرك ثلاثي الأبعاد. تحقق من الإنترنت.';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa9c8d0);scene.fog=new THREE.Fog(0xa9c8d0,90,235);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,360);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f5ff,0x53604e,2.15));const sun=new THREE.DirectionalLight(0xffe5c5,2.7);sun.position.set(-45,75,38);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-90;sun.shadow.camera.right=90;sun.shadow.camera.top=90;sun.shadow.camera.bottom=-90;scene.add(sun);
const mat=(c,r=.86,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const M={grass:mat(0x778d70),asphalt:mat(0x303942),side:mat(0xbdb8a9),curb:mat(0x777d7a),line:mat(0xe9dfc6),glass:mat(0x83b5c8,.3,.2),dark:mat(0x263946,.35),roof:mat(0x53595a),trunk:mat(0x71503a),leaf:mat(0x416c4a),metal:mat(0x424b50,.4,.65),yellow:mat(0xe3b75d),white:mat(0xf0e8d5)};
function box(w,h,d,m,x,y,z,p=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}
function cylinder(rt,rb,h,m,x,y,z,p=scene){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,9),m);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(300,300),M.grass);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
// Road grid with sidewalks, curbs, center dashes and pedestrian crossings
box(20,.12,250,M.asphalt,0,.04,0);box(250,.12,18,M.asphalt,0,.04,0);
for(let x=-90;x<=90;x+=30)if(x)box(9,.1,250,M.asphalt,x,.035,0);
for(let z=-90;z<=90;z+=30)if(z)box(250,.1,9,M.asphalt,0,.035,z);
for(const s of [-1,1]){box(2.2,.22,250,M.side,s*11.1,.13,0);box(250,.22,2.1,M.side,0,.13,s*10.1);box(.22,.28,250,M.curb,s*12.2,.16,0);box(250,.28,.22,M.curb,0,.16,s*11.2)}
for(let z=-115;z<120;z+=9)box(.13,.018,3.8,M.line,0,.12,z);
for(let x=-115;x<120;x+=9)box(3.8,.018,.13,M.line,x,.12,0);
for(const s of [-1,1])for(let i=-1;i<=1;i++){box(1,.025,7,M.white,s*13.2,.13,i*2);box(7,.025,1,M.white,i*2,.13,s*12.2)}
// Architectural blocks: layered facades, windows, balconies, awnings and rooftop details
const palettes=[0xc8b99f,0x9eafb5,0xd6cbbb,0x839397,0xb99d84,0xaab8aa,0xd0c3ae].map(c=>mat(c));
const trims=mat(0xeee3cf),awning=[0x47758a,0x9b5148,0x657c61,0xc18c50].map(c=>mat(c));
for(let gx=-3;gx<=3;gx++)for(let gz=-3;gz<=3;gz++){if(gx===0&&gz===0)continue;let bx=gx*30,bz=gz*30;if(gx===-1&&gz===1)continue;
for(let j=0;j<3;j++){if(Math.random()<.12)continue;let x=bx+(j-1)*8.4+(Math.random()-.5)*1.5,z=bz+(Math.random()-.5)*9,w=6.3+Math.random()*2,d=7+Math.random()*3,h=10+Math.random()*19,wall=palettes[Math.floor(Math.random()*palettes.length)];
box(w,h,d,wall,x,h/2,z);box(w+.22,.24,d+.22,M.roof,x,h+.12,z);box(w*.72,.18,d*.72,trims,x,h+.29,z);
for(let yy=2.3;yy<h-1;yy+=2.7){for(let xx=-w/2+1;xx<w/2-.5;xx+=1.75){box(1.02,1.25,.09,M.glass,x+xx,yy,z+d/2+.055);box(1.02,1.25,.09,M.glass,x+xx,yy,z-d/2-.055);box(1.1,.09,.16,M.metal,x+xx,yy-.68,z+d/2+.1)}}
box(w*.86,2.6,.18,M.dark,x,.0+1.45,z+d/2+.1);box(w*.95,.35,.7,awning[Math.floor(Math.random()*awning.length)],x,3,z+d/2+.38);
for(let k=-1;k<=1;k++)box(.11,.18,.11,M.yellow,x+k*1.4,3.1,z+d/2+.75);
if(h>20){cylinder(.12,.12,1.6,M.metal,x,h+.9,z);box(w*.3,.5,d*.3,M.roof,x,h+.65,z)}
}}
// Pocket park, paths, benches and planted trees
box(22,.16,22,mat(0x91a27d),-24,.16,24);box(2,.18,19,mat(0xc9b99a),-24,.28,24);box(19,.18,2,mat(0xc9b99a),-24,.28,24);
const benchmat=mat(0x75563d);for(const [x,z] of [[-30,20],[-18,28],[-28,31]]){box(2,.16,.55,benchmat,x,.65,z);cylinder(.07,.07,.7,M.metal,x-.7,.35,z);cylinder(.07,.07,.7,M.metal,x+.7,.35,z)}
for(let i=0;i<16;i++){const x=-33+Math.random()*18,z=15+Math.random()*18;cylinder(.2,.28,2.1,M.trunk,x,1.2,z);const crown=new THREE.Mesh(new THREE.SphereGeometry(1.25,10,8),M.leaf);crown.position.set(x,2.8,z);crown.scale.y=1.15;crown.castShadow=true;scene.add(crown)}
// Street lamps and bus-stop shelters
for(let z=-84;z<=84;z+=24)for(const s of [-1,1]){cylinder(.07,.12,5,M.metal,s*14,2.5,z);box(.95,.09,.1,M.metal,s*14.35,4.92,z);const bulb=new THREE.Mesh(new THREE.SphereGeometry(.18,8,8),new THREE.MeshStandardMaterial({color:0xffe8b6,emissive:0x8b672d}));bulb.position.set(s*14.8,4.8,z);scene.add(bulb)}
box(4,.12,1.5,M.metal,17,.15,19);box(4,.12,.12,M.metal,17,2.1,19.6);for(const x of [15.1,18.9])box(.12,2,.12,M.metal,x,1.1,19.6);box(3.7,1.6,.06,M.glass,17,1.15,19.6);
// Character with articulated limbs
const player=new THREE.Group();scene.add(player);const skin=mat(0xc99170),shirt=mat(0x285b78),pants=mat(0x202a35),shoe=mat(0x161b20);
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.36,.68,4,8),shirt);torso.position.y=1.25;player.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.25,14,12),skin);head.position.y=1.92;player.add(head);
const limbs=[];for(const side of [-1,1]){const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.105,.48,3,7),shirt);arm.position.set(side*.43,1.32,0);player.add(arm);limbs.push(arm);const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.14,.48,3,7),pants);leg.position.set(side*.19,.48,0);player.add(leg);limbs.push(leg);box(.29,.15,.43,shoe,side*.19,.12,-.08,player)}
player.position.set(-2,0,6);
// Compact sedan with roof, windows, lights, mirrors and four wheels
const car=new THREE.Group();scene.add(car);const body=mat(0x9d3940,.42,.25),tire=mat(0x171b20),chrome=mat(0xb4c2c8,.28,.75),lamp=mat(0xffe9bf,.25);
box(2.2,.63,4.35,body,0,.78,0,car);box(1.8,.82,2.25,M.dark,0,1.43,-.24,car);box(1.9,.12,1.15,body,0,1.88,-.2,car);box(1.88,.12,.08,chrome,0,1.05,2.12,car);box(1.88,.12,.08,chrome,0,1.05,-2.12,car);
for(const x of [-1,1]){box(.25,.16,.55,body,x*1.12,1.15,.5,car);box(.3,.14,.5,lamp,x*.72,.84,2.2,car);box(.3,.14,.5,mat(0xa52b28),x*.72,.84,-2.2,car);for(const z of [-1.4,1.4]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.39,.39,.24,18),tire);w.rotation.z=Math.PI/2;w.position.set(x*1.08,.43,z);car.add(w);const r=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.25,12),chrome);r.rotation.z=Math.PI/2;r.position.set(x*1.09,.43,z);car.add(r)}}
car.position.set(2,0,1);
// Input: hold-to-move controls and swipe camera
const keys={};function bind(id,k){const el=$(id),down=e=>{e.preventDefault();keys[k]=true;try{el.setPointerCapture(e.pointerId)}catch(_){}};el.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>keys[k]=false))}
bind('up','f');bind('down','b');bind('left','l');bind('right','r');bind('brake','brake');
let driving=false,yaw=0,carSpeed=0,drag=null,pitch=.12;const enter=$('enter');
function enterExit(){if(driving){driving=false;player.visible=true;player.position.copy(car.position).add(new THREE.Vector3(2,0,0));yaw=car.rotation.y;$('mode').textContent='استكشاف الحي';enter.innerHTML='دخول<br>السيارة';return}if(player.position.distanceTo(car.position)<8){driving=true;player.visible=false;$('mode').textContent='قيادة السيارة';enter.textContent='خروج';hint.textContent='استخدم الأسهم للقيادة واسحب الشاشة لتغيير زاوية الكاميرا';setTimeout(()=>hint.style.opacity='0',3300)}else{hint.textContent='اقترب من السيارة أولاً';hint.style.opacity='1';setTimeout(()=>hint.style.opacity='0',1700)}}
enter.addEventListener('click',enterExit);
renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.38&&e.clientY<innerHeight-165)drag={x:e.clientX,y:e.clientY,id:e.pointerId}});renderer.domElement.addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId){yaw-=(e.clientX-drag.x)*.006;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-drag.y)*.002,-.05,.48);drag.x=e.clientX;drag.y=e.clientY}});['pointerup','pointercancel'].forEach(ev=>renderer.domElement.addEventListener(ev,()=>drag=null));
const clock=new THREE.Clock(),move=new THREE.Vector3(),map=$('map').getContext('2d');
function drawMap(t){map.clearRect(0,0,188,188);map.fillStyle='#182a33';map.fillRect(0,0,188,188);map.strokeStyle='#718188';map.lineWidth=8;for(let i=0;i<188;i+=47){map.beginPath();map.moveTo(i,0);map.lineTo(i,188);map.stroke();map.beginPath();map.moveTo(0,i);map.lineTo(188,i);map.stroke()}map.fillStyle='#527a59';map.fillRect(15,122,38,38);map.fillStyle='#fff';map.beginPath();map.arc(94+t.x*.5,94+t.z*.5,5,0,Math.PI*2);map.fill();map.strokeStyle='#fff';map.lineWidth=2;map.beginPath();map.moveTo(94+t.x*.5,94+t.z*.5);map.lineTo(94+t.x*.5-Math.sin(yaw)*13,94+t.z*.5-Math.cos(yaw)*13);map.stroke()}
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04),f=(keys.f?1:0)-(keys.b?1:0),turn=(keys.r?1:0)-(keys.l?1:0);if(driving){const brake=keys.brake?Math.pow(.68,dt*12):1;carSpeed=THREE.MathUtils.clamp((carSpeed+f*12*dt)*Math.pow(.94,dt*30)*brake,-5,24);car.rotation.y-=turn*dt*(.75+Math.abs(carSpeed)*.045);car.position.x+=Math.sin(car.rotation.y)*carSpeed*dt;car.position.z+=Math.cos(car.rotation.y)*carSpeed*dt;car.position.x=THREE.MathUtils.clamp(car.position.x,-105,105);car.position.z=THREE.MathUtils.clamp(car.position.z,-105,105)}else{if(f||turn){yaw+=turn*dt*2.15;player.rotation.y=yaw;move.set(0,0,-f*dt*5).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);player.position.add(move);const swing=Math.sin(clock.elapsedTime*10)*Math.min(1,Math.abs(f));limbs[0].rotation.x=swing*.55;limbs[1].rotation.x=-swing*.55;limbs[2].rotation.x=-swing*.6;limbs[3].rotation.x=swing*.6}else{limbs.forEach(l=>l.rotation.x*=.8)}player.position.x=THREE.MathUtils.clamp(player.position.x,-108,108);player.position.z=THREE.MathUtils.clamp(player.position.z,-108,108)}
const target=driving?car.position:player.position,rot=driving?car.rotation.y:yaw,dist=driving?10:8.5,desired=new THREE.Vector3(Math.sin(rot)*dist,4.1+pitch*5,Math.cos(rot)*dist).add(target);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(target.x,target.y+1.1,target.z);$('speed').textContent=String(Math.round(Math.abs(carSpeed)*3.6));$('area').textContent=target.x<-14&&target.z>12?'الحديقة':Math.abs(target.x)<18&&Math.abs(target.z)<18?'وسط الحي':'الشوارع';drawMap(target);renderer.render(scene,camera)}
loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script></body></html>
